<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0b10" />
      <stop offset="50%" stop-color="#0f111a" />
      <stop offset="100%" stop-color="#07080c" />
    </linearGradient>

    <!-- Ambient Glows -->
    <radialGradient id="glowLeft" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowRight" cx="80%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>

    <!-- Phone Frame Gradient -->
    <linearGradient id="bezelGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#232631" />
      <stop offset="100%" stop-color="#0e1015" />
    </linearGradient>

    <!-- Accent Pill Gradient -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Subtle Drop Shadows -->
    <filter id="phoneShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, sans-serif; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGradient)" />
  <rect width="1200" height="630" fill="url(#glowLeft)" />
  <rect width="1200" height="630" fill="url(#glowRight)" />

  <!-- Subtle Ambient Grid -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="126" x2="1200" y2="126" />
    <line x1="0" y1="252" x2="1200" y2="252" />
    <line x1="0" y1="378" x2="1200" y2="378" />
    <line x1="0" y1="504" x2="1200" y2="504" />
    <line x1="240" y1="0" x2="240" y2="630" />
    <line x1="480" y1="0" x2="480" y2="630" />
    <line x1="720" y1="0" x2="720" y2="630" />
    <line x1="960" y1="0" x2="960" y2="630" />
  </g>

  <!-- ===================================================================== -->
  <!-- LEFT COLUMN: Typography & Attribution Content                         -->
  <!-- ===================================================================== -->
  <g transform="translate(80, 90)">
    <!-- Brand Tag Badge -->
    <rect x="0" y="0" width="220" height="34" rx="17" fill="rgba(99, 102, 241, 0.14)" stroke="rgba(99, 102, 241, 0.35)" stroke-width="1.2" />
    <circle cx="18" cy="17" r="4.5" fill="#818cf8" />
    <text x="32" y="22" fill="#c7d2fe" class="font-sans" font-size="12" font-weight="700" letter-spacing="1.2">PROTOSTAGE FLOW</text>

    <!-- Main Headline -->
    <text x="0" y="95" fill="#ffffff" class="font-sans" font-size="46" font-weight="800" letter-spacing="-1.2">Interactive Mobile</text>
    <text x="0" y="150" fill="#ffffff" class="font-sans" font-size="46" font-weight="800" letter-spacing="-1.2">Prototype</text>

    <!-- Subtitle / Value Prop -->
    <text x="0" y="200" fill="#94a3b8" class="font-sans" font-size="18" font-weight="400" line-height="28">
      <tspan x="0" dy="0">Experience live screen-to-screen journeys with error</tspan>
      <tspan x="0" dy="28">scenarios, condition toggles, and interactive review pins.</tspan>
    </text>

    <!-- Tags Row -->
    <g transform="translate(0, 280)">
      <rect x="0" y="0" width="84" height="28" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" />
      <text x="14" y="18" fill="#94a3b8" class="font-sans" font-size="12" font-weight="600">Mobile</text>

      <rect x="94" y="0" width="68" height="28" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" />
      <text x="108" y="18" fill="#94a3b8" class="font-sans" font-size="12" font-weight="600">iOS 17</text>

      <rect x="172" y="0" width="98" height="28" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" />
      <text x="186" y="18" fill="#94a3b8" class="font-sans" font-size="12" font-weight="600">Interactive</text>

      <rect x="280" y="0" width="112" height="28" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" />
      <text x="294" y="18" fill="#94a3b8" class="font-sans" font-size="12" font-weight="600">Embeddable</text>
    </g>

    <!-- Required Attribution Banner -->
    <g transform="translate(0, 360)">
      <rect x="0" y="0" width="460" height="52" rx="26" fill="rgba(20, 22, 30, 0.88)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.2" />

      <!-- Sparkle/Brand Icon -->
      <circle cx="28" cy="26" r="12" fill="url(#accentGradient)" />
      <text x="23" y="31" fill="#ffffff" class="font-sans" font-size="12" font-weight="800">P</text>

      <!-- Attribution Text -->
      <text x="52" y="32" class="font-sans" font-size="14">
        <tspan fill="#94a3b8">Built with </tspan>
        <tspan fill="#818cf8" font-weight="700">ProtoStage</tspan>
        <tspan fill="#64748b"> by </tspan>
        <tspan fill="#ffffff" font-weight="700">Charlie Herbozo-Vidal</tspan>
      </text>
    </g>
  </g>

  <!-- ===================================================================== -->
  <!-- RIGHT COLUMN: iPhone 15/16 Device Frame Mockup                        -->
  <!-- ===================================================================== -->
  <g transform="translate(780, 50)" filter="url(#phoneShadow)">
    <!-- Device Bezel (Outer Body) -->
    <rect x="0" y="0" width="280" height="560" rx="46" fill="url(#bezelGradient)" stroke="#3a3d4d" stroke-width="2.5" />

    <!-- Inner Screen Cutout -->
    <rect x="10" y="10" width="260" height="540" rx="38" fill="#ffffff" />

    <!-- Screen Content Mockup -->
    <g transform="translate(10, 10)">
      <!-- Screen Background -->
      <rect width="260" height="540" rx="38" fill="#0f172a" />

      <!-- Screen Header Bar -->
      <rect x="20" y="52" width="120" height="12" rx="6" fill="#ffffff" opacity="0.9" />
      <rect x="20" y="70" width="80" height="8" rx="4" fill="#64748b" />

      <!-- Card 1 (Main Action Card) -->
      <rect x="16" y="96" width="228" height="110" rx="16" fill="#1e293b" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <circle cx="44" cy="130" r="16" fill="url(#accentGradient)" />
      <rect x="70" y="122" width="100" height="10" rx="5" fill="#ffffff" />
      <rect x="70" y="138" width="60" height="8" rx="4" fill="#94a3b8" />
      <rect x="36" y="172" width="188" height="22" rx="11" fill="rgba(99, 102, 241, 0.25)" />
      <rect x="90" y="179" width="80" height="8" rx="4" fill="#818cf8" />

      <!-- Card 2 (Secondary Flow Item) -->
      <rect x="16" y="218" width="228" height="80" rx="16" fill="#1e293b" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <rect x="36" y="238" width="120" height="10" rx="5" fill="#ffffff" opacity="0.8" />
      <rect x="36" y="254" width="80" height="8" rx="4" fill="#64748b" />
      <circle cx="218" cy="258" r="8" fill="#10b981" />

      <!-- Card 3 (Tertiary Flow Item) -->
      <rect x="16" y="310" width="228" height="70" rx="16" fill="#1e293b" opacity="0.6" />
      <rect x="36" y="328" width="90" height="8" rx="4" fill="#94a3b8" />
      <rect x="36" y="342" width="130" height="6" rx="3" fill="#64748b" />

      <!-- Screen Bottom Button -->
      <rect x="16" y="460" width="228" height="42" rx="21" fill="url(#accentGradient)" />
      <rect x="80" y="476" width="100" height="10" rx="5" fill="#ffffff" />

      <!-- Interactive Pin Drop Marker Overlay -->
      <g transform="translate(185, 120)">
        <circle cx="0" cy="0" r="11" fill="#ef4444" stroke="#ffffff" stroke-width="2" />
        <text x="-3" y="4" fill="#ffffff" class="font-sans" font-size="10" font-weight="800">1</text>
      </g>
    </g>

    <!-- Dynamic Island -->
    <rect x="100" y="20" width="80" height="22" rx="11" fill="#000000" />
    <circle cx="164" cy="31" r="4.5" fill="#111116" stroke="#22222a" stroke-width="0.8" />

    <!-- Home Indicator -->
    <rect x="95" y="534" width="90" height="4" rx="2" fill="#ffffff" opacity="0.4" />
  </g>
</svg>
