<body>
  <div class="proto-page">
    <div class="stage-viewport">
      <div class="stage-toolbar">
        <span class="badge">ProtoStage</span>
        <span>iPhone 15 / 16 (390 × 844)</span>
      </div>

      <div class="stage-center">
        <!-- Device Frame with Bezel and Corner Masking -->
        <div class="device-frame">
          <div class="device-frame__dynamic-island">
            <div class="device-frame__camera"></div>
          </div>

          <!-- Screen Container -->
          <div class="device-frame__screen">
            <div id="app-shell">
              <header id="header-slot"></header>
              <main id="content-slot"></main>
              <footer id="footer-slot"></footer>
            </div>
          </div>

          <!-- Paints the rounded corners over the deliberately square screen -->
          <div class="device-frame__corner-mask"></div>

          <div class="device-frame__home-indicator"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Runtime Scripts -->
  <script src="./shell.js"></script>
  <script src="./flow-router.js"></script>
  <script src="./conditions.js"></script>
  <script src="./annotate.js" data-proto="charlie-herbozo/mobile-starter" data-comments="issues" data-repo="Charlie-HV97/protostage" data-labels="comment,prototype-feedback,designer:charlie-herbozo,mobile-starter"></script>
  <script src="./app.js"></script>
</body>
